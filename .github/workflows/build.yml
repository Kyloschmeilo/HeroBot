name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric mod and Paper plugin
        run: |
          set -o pipefail
          ./gradlew buildAll --continue --console=plain 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/report-build-errors.py build.log

      - uses: actions/upload-artifact@v4
        with:
          name: herobot-jars
          path: build/libs/**/*.jar
          if-no-files-found: error
